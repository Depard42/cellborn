[package]
name = "cellborn-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Клиенту нужен весь движок: он и есть тот, ради кого набор по умолчанию собран.
# `wav` сверх набора по умолчанию: звуки в игре не файлы, а сгенерированные
# сэмплы, и WAV — единственный формат, который можно собрать в памяти
# несколькими строками, без кодировщика.
bevy = { workspace = true, features = ["default", "wav"] }
serde.workspace = true
rand.workspace = true
tracing.workspace = true
lightyear.workspace = true
cellborn-common = { path = "../common" }

# Проверка и установка обновлений из релизов GitHub.
ureq.workspace = true
serde_json.workspace = true
zip.workspace = true
