[workspace]
resolver = "2"

members = [
    "crates/common",
    "crates/client",
    "crates/server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]

# ─────────────────────────────────────────────
# Engine
# ─────────────────────────────────────────────

# Собирается без набора по умолчанию: он тянет рендер, звук, окно и ввод, а
# сервер из всего этого не пользуется ничем — у него `MinimalPlugins`. Полный
# набор включает обратно клиент, единственный, кому он нужен.
#
# Заголовочная фича `std` нужна всем: без неё Bevy собирается под no_std.
bevy = {
    version = "0.19.0",
    default-features = false,
    features = ["std"],
}

# ─────────────────────────────────────────────
# Serialization / data
# ─────────────────────────────────────────────

serde = {
    version = "1",
    features = ["derive"],
}

# ─────────────────────────────────────────────
# Utilities
# ─────────────────────────────────────────────

rand = "0.9"
tracing = "0.1"

# ─────────────────────────────────────────────
# Обновление из релизов GitHub
# ─────────────────────────────────────────────

# Блокирующий HTTP с rustls: обновлятор работает в отдельном потоке, так что
# асинхронный клиент здесь только добавил бы рантайм и ничего не дал.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
serde_json = "1"
# Распаковка комплекта. Только deflate: остальные способы сжатия тянут за собой
# ещё библиотеки, а архив собираем мы сами и знаем, чем.
zip = { version = "6", default-features = false, features = ["deflate"] }

# ─────────────────────────────────────────────
# Multiplayer
# Lightyear 0.29.x
# Compatible with Bevy 0.19
# ─────────────────────────────────────────────

lightyear = {
    version = "0.29.0",
    features = [
        "interpolation",
        "prediction",
        "replication",
        "input_native",
        "netcode",
        "udp",
    ],
}

# ─────────────────────────────────────────────
# Physics
# Avian3D 0.7.x
# ─────────────────────────────────────────────

avian3d = {
    version = "0.7",
    features = [
        "serialize",
    ],
}

# ─────────────────────────────────────────────
# Lightyear ↔ Avian3D integration
# ─────────────────────────────────────────────

lightyear_avian3d = {
    version = "0.29.0",
}
# ─────────────────────────────────────────────
# Профили сборки
# ─────────────────────────────────────────────

# Сам код игры оставляем почти неоптимизированным — так отладочная информация
# остаётся честной, а сборка быстрой.
[profile.dev]
opt-level = 1

# А вот зависимости оптимизируем полностью. Bevy и Avian исполняются тысячи раз
# за кадр; без этого отладочная сборка идёт единицами кадров в секунду, и в ней
# невозможно ни поиграть, ни что-либо измерить. Пересобираются они один раз.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
# Тонкая LTO: заметно на горячих циклах, которые растянуты по трём крейтам
# (симуляция живёт в common, а вызывают её сервер и клиент).
#
# `codegen-units = 1` намеренно не ставим: он добавляет считаные проценты, а
# время сборки — включая кросс-сборку под Windows — заметно портит.
lto = "thin"
