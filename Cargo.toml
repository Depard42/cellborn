[workspace]
resolver = "2"

members = [
    "crates/common",
    "crates/client",
    "crates/server",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]

# ─────────────────────────────────────────────
# Engine
# ─────────────────────────────────────────────

bevy = {
    version = "0.19.0",
    default-features = true,
}

# ─────────────────────────────────────────────
# Serialization / data
# ─────────────────────────────────────────────

serde = {
    version = "1",
    features = ["derive"],
}

# ─────────────────────────────────────────────
# Utilities
# ─────────────────────────────────────────────

rand = "0.9"
tracing = "0.1"

# ─────────────────────────────────────────────
# Multiplayer
# Lightyear 0.29.x
# Compatible with Bevy 0.19
# ─────────────────────────────────────────────

lightyear = {
    version = "0.29.0",
    features = [
        "interpolation",
        "prediction",
        "replication",
        "input_native",
        "netcode",
        "udp",
    ],
}

# ─────────────────────────────────────────────
# Physics
# Avian3D 0.7.x
# ─────────────────────────────────────────────

avian3d = {
    version = "0.7",
    features = [
        "serialize",
    ],
}

# ─────────────────────────────────────────────
# Lightyear ↔ Avian3D integration
# ─────────────────────────────────────────────

lightyear_avian3d = {
    version = "0.29.0",
}