# Настройки сервера Cellborn.
# Меняются без пересборки: правь файл и перезапусти сервер.
# Любое значение перекрывается переменной окружения:
#   CELLBORN_MAX_ORGANISMS=120 ./cellborn-server
#
# Здесь только то, что решает сервер. Скорость, размер арены,
# тикрейт и цены мутаций остаются в коде: их считает и клиент,
# и расхождение сломало бы предсказание движения.

# --- сеть ---

# UDP-порт, который слушает сервер
port = 5555

# --- размер мира ---

# Сколько всего организмов может жить одновременно (игроки и боты)
max_organisms = 70

# Сколько особей может быть в одном роду: предел размножения колонии
max_colony_size = 35

# Сколько частей может отрастить одно тело (потолок 100: по нему рисует клиент)
max_parts = 100

# Длительность одного сезона в секундах
season_length = 180

# --- еда ---

# Сколько частиц еды держать в воде (умножается на плотность сезона)
food_target = 260

# Сколько частиц появляется в секунду
food_spawn_rate = 14

# Сколько детрита оставляет труп (плюс надбавка за массу)
corpse_nutrients = 6

# --- выживание ---

# Базовый расход энергии в секунду
base_upkeep = 0.25

# Во что обходится единица штрафа адаптации, энергии в секунду
penalty_upkeep = 1

# Сколько здоровья теряется в секунду при нулевой энергии
starvation_damage = 3

# Сколько здоровья восстанавливается в секунду
health_regen = 2

# Доля запаса энергии, выше которой организм лечится (0.5 = половина)
well_fed_fraction = 0.5

# --- бой ---

# Урон в секунду голой мембраной, без оружия
base_attack = 1.5

# Насколько далеко от тел засчитывается контакт
attack_margin = 0.25

# Сколько секунд после удара не восстанавливается здоровье
combat_regen_block = 5

# Сколько энергии даёт единица массы съеденной жертвы
kill_energy_yield = 3.5

# Очков мутаций за убийство
points_per_kill = 3

# На сколько органов должны разойтись чужаки, чтобы драться
aggression_threshold = 7

# То же для родни: после этого род раскалывается (клиент красит по своим значениям)
kin_split_threshold = 15

# --- размножение ---

# Секунд между делениями без делителей
base_division_time = 26

# Какую долю запаса надо накопить, чтобы делиться (0.7 = 70%)
division_energy_fraction = 0.7

# Какую долю своей энергии родитель отдаёт потомку
division_energy_share = 0.45

# Шанс, что потомок родится с лишней случайной частью
base_mutation_chance = 0.25

# --- смерть ---

# Через сколько секунд игрок возвращается в игру
respawn_delay = 5

# Какая доля очков мутаций переживает смерть
death_point_retention = 0.5

# --- очки мутаций ---

# Сколько энергии надо съесть на одно очко
energy_per_mutation_point = 40

# Очков за переживание смены сезона
points_per_season = 2

# Минимум секунд между принятыми запросами мутации от одного клиента
mutation_cooldown = 0.25

# --- боты ---

# Сколько диких ботов поддерживать в мире
wild_target = 9

# Предел частей для диких: они мутируют бесплатно, поэтому ниже общего
wild_max_parts = 24

# Раз во сколько секунд дикий бот бесплатно отращивает часть
wild_mutation_interval = 12

# На каком расстоянии бот видит еду и врагов
bot_vision = 16

# --- ядовитые облака ---

# Раз во сколько секунд железа оставляет облако
toxin_interval = 9

# Сколько секунд живёт облако
toxin_lifetime = 11

# Радиус облака
toxin_radius = 3.2
